name: Python CI
on:
  push:
    paths:
      - 'cloud-engineering-orchestration/**'
  pull_request:
    paths:
      - 'cloud-engineering-orchestration/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-engineering-orchestration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cloud-engineering-orchestration/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -q
