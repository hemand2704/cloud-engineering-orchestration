[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-engineering-orchestration"
version = "1.0.0"
description = "AWS S3, Dagster and GitHub Actions portfolio pipeline"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3.0", "PyYAML>=6.0", "boto3>=1.34", "dagster>=1.8,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
